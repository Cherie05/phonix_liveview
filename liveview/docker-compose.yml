version: "3.8"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: liveview_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d liveview_prod"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY_BASE: "Q7bSGLhUuuYZ/weK2ROsuYg8pJEe1ybU9v1ZDhRs21td3mjmmVslC404eJODgfw4"
      DATABASE_URL: "postgres://postgres:postgres@db:5432/liveview_prod"
      PHX_HOST: "localhost"
      PORT: "4000"
      ALLOWED_ORIGINS: "//localhost:4000,//127.0.0.1:4000"
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads    # optional: persist uploads

volumes:
  pgdata:
